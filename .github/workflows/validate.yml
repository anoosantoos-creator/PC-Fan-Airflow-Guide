name: apply repository update

on:
  push:
    branches:
      - agent/include-complete-openfoam-cases

permissions:
  contents: write

jobs:
  apply-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply prepared tree
        shell: bash
        run: |
          if [[ ! -f .repository-update.tar.gz ]]; then
            echo "No repository update archive is present."
            exit 0
          fi

          tar -xzf .repository-update.tar.gz
          rm .repository-update.tar.gz

          git config user.name "anoosantoos-creator"
          git config user.email "302301284+anoosantoos-creator@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "The prepared tree has no changes."
            exit 0
          fi

          git commit -m "Include complete OpenFOAM rerun"
          git push origin "HEAD:${GITHUB_REF_NAME}"
